getProjectsCountQuery=SELECT  DATENAME(MONTH, DATEADD(MONTH, all_months.month - 1, '1900-01-01')) AS month,COALESCE(plan_counts.total_count, 0) AS total_count FROM (SELECT 1 AS month UNION SELECT 2  UNION SELECT 3  UNION SELECT 4 UNION SELECT 5 UNION SELECT 6  UNION SELECT 7 UNION SELECT 8 UNION SELECT 9  UNION SELECT 10  UNION SELECT 11 UNION SELECT 12) AS all_months LEFT JOIN (SELECT DATEPART(MONTH, INSERT_DATE) AS month,COUNT(*) AS total_count FROM PROJECT WHERE  YEAR(INSERT_DATE) = YEAR(GETDATE()) GROUP BY  MONTH(INSERT_DATE)) AS plan_counts ON all_months.month = plan_counts.month where all_months.month <= MONTH(GETDATE()) ORDER BY all_months.month;

getExperimentsCountQuery=SELECT  DATENAME(MONTH, DATEADD(MONTH, all_months.month - 1, '1900-01-01'))AS month, COALESCE(exp_counts.total_count, 0) AS total_count FROM( SELECT 1 AS month UNION SELECT 2 UNION SELECT 3 UNION SELECT 4 UNION SELECT 5 UNION SELECT 6 UNION SELECT 7 UNION SELECT 8 UNION SELECT 9 UNION SELECT 10 UNION SELECT 11 UNION SELECT 12) AS all_months LEFT JOIN (SELECT DATEPART(MONTH, INSERT_DATE) AS month, COUNT(*) AS total_count FROM  EXPERIMENT WHERE  YEAR(INSERT_DATE) = YEAR(GETDATE()) GROUP BY  DATENAME(MONTH, INSERT_DATE),MONTH(INSERT_DATE)) AS exp_counts ON all_months.month = exp_counts.month where all_months.month <= MONTH(GETDATE()) ORDER BY all_months.month
getAnalysisExpCountQuery=SELECT  DATENAME(MONTH, DATEADD(MONTH, all_months.month - 1, '1900-01-01')) AS month,COALESCE(anl_counts.total_count, 0) AS total_count FROM  (SELECT 1 AS month UNION SELECT 2 UNION SELECT 3 UNION SELECT 4 UNION SELECT 5 UNION SELECT 6 UNION SELECT 7 UNION SELECT 8  UNION SELECT 9 UNION SELECT 10 UNION SELECT 11 UNION SELECT 12) AS all_months LEFT JOIN (SELECT DATEPART(MONTH, INSERT_DATE) AS month,COUNT(*) AS total_count FROM ANALYSIS_EXPERIMENT WHERE YEAR(INSERT_DATE) = YEAR(GETDATE()) GROUP BY  DATENAME(MONTH, INSERT_DATE),MONTH(INSERT_DATE)) AS anl_counts ON all_months.month = anl_counts.month where all_months.month <= MONTH(GETDATE()) ORDER BY all_months.month

#Formulation-Experiments-Status-Piechart
#getExperimentByStatusQuery=SELECT exp_status, SUM(total_count) AS total_count FROM (SELECT CASE WHEN status = 'Complete' THEN 'Complete' WHEN status = 'Analysis Submitted' THEN 'Analysis Submitted' WHEN status = 'Inprogress' THEN 'In Progress' WHEN status = 'COA Generated' THEN 'COA Generated' WHEN status = 'Created TRF' THEN 'Created TRF' ELSE 'others' END AS exp_status, COUNT(*) AS total_count FROM EXPERIMENT WHERE YEAR(INSERT_DATE) = YEAR(GETDATE()) AND status IN ('Inprogress', 'Complete', 'Created TRF', 'Analysis Submitted', 'COA Generated') GROUP BY Status) AS subquery GROUP BY exp_status ORDER BY CASE exp_status WHEN 'In Progress' THEN 1 WHEN 'Complete' THEN 2 WHEN 'Created TRF' THEN 3 WHEN 'Analysis Submitted' THEN 4 WHEN 'COA Generated' THEN 5 ELSE 6 END;
getExperimentByStatusQuery=WITH ExpectedStatuses AS (SELECT 'Inprogress' AS exp_status UNION ALL SELECT 'Complete' UNION ALL SELECT 'Created TRF' UNION ALL SELECT 'Analysis Submitted' UNION ALL SELECT 'COA Approved' UNION ALL SELECT 'COA Reviewed' UNION ALL SELECT 'COA Generated' UNION ALL SELECT 'Others') SELECT es.exp_status, COALESCE(subquery.total_count, 0) AS total_count FROM ExpectedStatuses es LEFT JOIN (SELECT CASE WHEN experiment_status IN ('Complete', 'Analysis Submitted', 'Inprogress', 'COA Generated', 'COA Approved', 'COA Reviewed', 'Created TRF') THEN experiment_status ELSE 'Others' END AS exp_status, COUNT(*) AS total_count FROM EXPERIMENT WHERE YEAR(INSERT_DATE) = YEAR(GETDATE()) GROUP BY experiment_status) AS subquery ON es.exp_status = subquery.exp_status ORDER BY CASE es.exp_status WHEN 'Inprogress' THEN 1 WHEN 'Complete' THEN 2 WHEN 'Created TRF' THEN 3 WHEN 'Analysis Submitted' THEN 4 WHEN 'COA Approved' THEN 5 WHEN 'COA Reviewed' THEN 6 WHEN 'COA Generated' THEN 7 ELSE 8 END;


#TRF-By-Status-Piechart
#getTrfByStatusQuery=SELECT TRF_STATUS, COUNT(*) AS total_count FROM (SELECT t.TRF_STATUS FROM TRF t LEFT JOIN EXPERIMENT Ex ON t.EXP_ID = ex.EXP_ID WHERE YEAR(t.INSERT_DATE) = YEAR(GETDATE()) AND t.TRF_STATUS <> 'active' GROUP BY t.TRF_STATUS, Ex.EXPERIMENT_NAME) AS subquery GROUP BY TRF_STATUS ORDER BY CASE TRF_STATUS WHEN 'New' THEN 1 WHEN 'Inprogress' THEN 2 WHEN 'Analysis Submitted' THEN 3 ELSE 4 END;
getTrfByStatusQuery=WITH ExpectedStatuses AS (SELECT 'New' AS TRF_STATUS UNION ALL SELECT 'Inprogress' UNION ALL SELECT 'Analysis Submitted') SELECT es.TRF_STATUS, COALESCE(subquery.total_count, 0) AS total_count FROM ExpectedStatuses es LEFT JOIN (SELECT t.TRF_STATUS, COUNT(*) AS total_count FROM TRF t LEFT JOIN EXPERIMENT Ex ON t.EXP_ID = ex.EXP_ID WHERE YEAR(t.INSERT_DATE) = YEAR(GETDATE()) AND t.TRF_STATUS <> 'active' GROUP BY t.TRF_STATUS) AS subquery ON es.TRF_STATUS = subquery.TRF_STATUS ORDER BY CASE es.TRF_STATUS WHEN 'New' THEN 1 WHEN 'Inprogress' THEN 2 WHEN 'Analysis Submitted' THEN 3 ELSE 4 END;

#getAnalysisExpStatusQuery=SELECT status ,sum(total_count) AS total_count FROM(SELECT CASE WHEN status = 'Inprogress' THEN 'In Progress' WHEN status = 'Complete' THEN 'Complete' WHEN status = 'Inreview' THEN 'In Review' WHEN status = 'Need Correction' THEN 'Need Correction' WHEN status = 'Review Completed' THEN 'Review Completed' WHEN status = 'Analysis Submitted' THEN 'Analysis Submitted' ELSE 'others' END as status,COUNT(*) AS total_count FROM ANALYSIS_EXPERIMENT WHERE YEAR(INSERT_DATE) = YEAR(GETDATE())AND status IN ('Inprogress', 'Complete', 'Inreview', 'Need Correction', 'Review Completed','Analysis Submitted' ) GROUP BY Status) AS subquery GROUP BY status ORDER BY CASE status WHEN 'In Progress' THEN 1 WHEN 'Complete' THEN 2 WHEN 'In Review' THEN 3 WHEN 'Need Correction' THEN 4 WHEN 'Review Completed' THEN 5 WHEN 'Analysis Submitted' THEN 6 ELSE 7 END;

getAnalysisExpStatusQuery=WITH ExpectedStatuses AS (SELECT 'In Progress' AS status UNION ALL SELECT 'Complete' UNION ALL SELECT 'Analysis Submitted' UNION ALL SELECT 'COA Generated' UNION ALL SELECT 'COA Reviewed' UNION ALL SELECT 'COA Approved' UNION ALL SELECT 'Others') SELECT es.status, COALESCE(subquery.total_count, 0) AS total_count FROM ExpectedStatuses es LEFT JOIN (SELECT CASE WHEN status = 'Inprogress' THEN 'In Progress' WHEN status = 'Complete' THEN 'Complete' WHEN status = 'Analysis Submitted' THEN 'Analysis Submitted' WHEN status = 'COA Generated' THEN 'COA Generated' WHEN status = 'COA Reviewed' THEN 'COA Reviewed' WHEN status = 'COA Approved' THEN 'COA Approved' ELSE 'Others' END AS status, COUNT(*) AS total_count FROM ANALYSIS_EXPERIMENT WHERE YEAR(INSERT_DATE) = YEAR(GETDATE()) AND status IN ('Inprogress', 'Complete', 'Analysis Submitted', 'COA Generated', 'COA Reviewed', 'COA Approved') GROUP BY status) AS subquery ON es.status = subquery.status ORDER BY CASE es.status WHEN 'In Progress' THEN 1 WHEN 'Complete' THEN 2 WHEN 'Analysis Submitted' THEN 3 WHEN 'COA Generated' THEN 4 WHEN 'COA Reviewed' THEN 5 WHEN 'COA Approved' THEN 6 ELSE 7 END;
