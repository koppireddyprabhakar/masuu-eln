get.user.details.list=SELECT U.USER_ID, U.FIRST_NAME, U.LAST_NAME, U.DATE_OF_BIRTH, U.GENDER, U.DEPT_ID, U.ROLE_ID, U.CONTACT_NO, U.MAIL_ID, U.STATUS, U.ADDRESS_LINE1, U.ADDRESS_LINE2, U.CITY, U.ZIP_CODE, U.INSERT_DATE, U.INSERT_USER, U.UPDATE_DATE, U.UPDATE_USER,U.ACCOUNT_LOCKED, UD.DOSAGE_ID, UR.ROLE_NAME, D.DEPARTMENT_NAME, UT.TEAM_ID,U.CERTIFIED_REVIEWER, U.COA_PERMISSION FROM USERS_DETAILS U LEFT JOIN USER_DOSAGE UD ON U.USER_ID = UD.USER_ID LEFT JOIN USER_ROLE UR ON U.ROLE_ID = UR.ROLE_ID LEFT JOIN DEPARTMENT D ON U.DEPT_ID = D.DEPT_ID LEFT JOIN USER_TEAM UT ON U.USER_ID = UT.USER_ID  WHERE 1 = 1 AND U.STATUS = 'Active' 
createUsersDetails=INSERT INTO USERS_DETAILS(FIRST_NAME, LAST_NAME, DATE_OF_BIRTH, GENDER, DEPT_ID, ROLE_ID, CONTACT_NO, MAIL_ID, STATUS, ADDRESS_LINE1, ADDRESS_LINE2, CITY, ZIP_CODE, INSERT_DATE, INSERT_USER, UPDATE_DATE, UPDATE_USER, PASSWORD, FIRSTLOGIN, CERTIFIED_REVIEWER, COA_PERMISSION) VALUES (:firstName, :lastName, :dateOfBirth, :gender, :deptId, :roleId, :contactNo, :mailId, :status, :addressLine1, :addressLine2, :city, :zipCode, :insertDate, :insertUser, :updateDate, :updateUser, :password, :firstLogin, :certifiedReviewer, :coaPermission) 
updateUsersDetails=UPDATE USERS_DETAILS SET FIRST_NAME = :firstName, LAST_NAME = :lastName, DATE_OF_BIRTH = :dateOfBirth, GENDER = :gender, DEPT_ID = :deptId, ROLE_ID = :roleId, CERTIFIED_REVIEWER = :certifiedReviewer, COA_PERMISSION = :coaPermission, CONTACT_NO = :contactNo, MAIL_ID = :mailId, STATUS = :status, ADDRESS_LINE1 = :addressLine1, ADDRESS_LINE2 = :addressLine2, CITY = :city, ZIP_CODE = :zipCode, UPDATE_DATE = :updateDate, UPDATE_USER = :updateUser, ACCOUNT_LOCKED = CASE WHEN :unlock = 0 THEN 0 ELSE ACCOUNT_LOCKED END, FAILED_ATTEMPTS = CASE WHEN :unlock = 0 THEN 0 ELSE FAILED_ATTEMPTS END WHERE USER_ID = :userId AND 1=1
deleteUsersDetails=DELETE FROM USERS_DETAILS WHERE USER_ID=?

createUserTeam=INSERT INTO USER_TEAM(USER_ID, TEAM_ID, STATUS, INSERT_DATE, INSERT_USER, UPDATE_DATE, UPDATE_USER) VALUES (:userId, :teamId, :status, :insertDate, :insertUser, :updateDate, :updateUser)
updateUserTeam=UPDATE USER_TEAM SET USER_ID = :userId, TEAM_ID = :teamId, STATUS = :status, UPDATE_DATE = :updateDate, UPDATE_USER = :updateUser WHERE USER_ID= :userId AND 1=1

reviewerdetails=SELECT Prepared.Name AS Prepared_Name, Prepared.Designation AS Prepared_Designation, Prepared.Date AS Created_Date, Reviewer.Name AS Reviewer_Name, Reviewer.Designation AS Reviewer_Designation, Reviewer.Date AS Reviewed_Date FROM (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, AE.INSERT_DATE AS Date, AE.ANALYSIS_EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[ANALYSIS_EXPERIMENT] AE ON UD.USER_ID = AE.USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE AE.ANALYSIS_EXP_ID = 115) AS Prepared LEFT JOIN (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, AR.INSERT_DATE AS Date, AR.ANALYSIS_EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[ANALYSIS_REVIEW] AR ON UD.USER_ID = AR.REVIEW_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE AR.ANALYSIS_EXP_ID = 115) AS Reviewer ON Prepared.ANALYSIS_EXP_ID = Reviewer.ANALYSIS_EXP_ID;
insertcoareviewDetails=INSERT INTO COA_DETAILS (EXP_ID, ANALYSIS_EXP_ID, PREPARED_BY_USER_ID, REVIEWED_BY_USER_ID, APPROVED_BY_USER_ID, PREPARED_BY_DATE, REVIEWED_BY_DATE, APPROVED_BY_DATE, INSERT_DATE, UPDATE_DATE,COMPLIANCE_STATUS) VALUES (:expId, :analysisExpId, :preparedByUserId, :reviewedByUserId, :approvedByUserId, :preparedByDate, :reviewedByDate, :approvedByDate, :insertDate, :updateDate,:complianceStatus);
getCoaReviewDetailsByExpId = SELECT Prepared.Name AS Prepared_Name, Prepared.Designation AS Prepared_Designation, Prepared.Date AS Prepared_Date, Reviewer.Name AS Reviewer_Name, Reviewer.Designation AS Reviewer_Designation, Reviewer.Date AS Reviewed_Date, Approver.Name AS Approver_Name, Approver.Designation AS Approver_Designation, Approver.Date AS Approved_Date, CD.COMPLIANCE_STATUS FROM (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, CD.PREPARED_BY_DATE AS Date, CD.EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[COA_DETAILS] CD ON UD.USER_ID = CD.PREPARED_BY_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE CD.EXP_ID = :experimentId) AS Prepared LEFT JOIN (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, CD.REVIEWED_BY_DATE AS Date, CD.EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[COA_DETAILS] CD ON UD.USER_ID = CD.REVIEWED_BY_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE CD.EXP_ID = :experimentId) AS Reviewer ON Prepared.EXP_ID = Reviewer.EXP_ID LEFT JOIN (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, CD.APPROVED_BY_DATE AS Date, CD.EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[COA_DETAILS] CD ON UD.USER_ID = CD.APPROVED_BY_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE CD.EXP_ID = :experimentId) AS Approver ON Prepared.EXP_ID = Approver.EXP_ID INNER JOIN [dbo].[COA_DETAILS] CD ON Prepared.EXP_ID = CD.EXP_ID;
updatecoareviewDetails=UPDATE COA_DETAILS SET REVIEWED_BY_USER_ID = :reviewedByUserId, REVIEWED_BY_DATE = :reviewedByDate WHERE EXP_ID = :expId;
updatecoaaprovalDetails=UPDATE COA_DETAILS SET APPROVED_BY_USER_ID = :approvedByUserId, APPROVED_BY_DATE = :approvedByDate WHERE EXP_ID = :expId;
updatecoaanalysisreview=UPDATE COA_DETAILS SET REVIEWED_BY_USER_ID = :reviewedByUserId, REVIEWED_BY_DATE = :reviewedByDate WHERE ANALYSIS_EXP_ID = :analysisExpId;
updatecoaanalysisaproval = UPDATE COA_DETAILS SET APPROVED_BY_USER_ID = :approvedByUserId, APPROVED_BY_DATE = :approvedByDate WHERE ANALYSIS_EXP_ID = :analysisExpId;
getCoaReviewDetailsByanalysisId = SELECT Prepared.Name AS Prepared_Name, Prepared.Designation AS Prepared_Designation, Prepared.Date AS Prepared_Date, Reviewer.Name AS Reviewer_Name, Reviewer.Designation AS Reviewer_Designation, Reviewer.Date AS Reviewed_Date, Approver.Name AS Approver_Name, Approver.Designation AS Approver_Designation, Approver.Date AS Approved_Date, CD.COMPLIANCE_STATUS FROM (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, CD.PREPARED_BY_DATE AS Date, CD.ANALYSIS_EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[COA_DETAILS] CD ON UD.USER_ID = CD.PREPARED_BY_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE CD.ANALYSIS_EXP_ID = :analysisId) AS Prepared LEFT JOIN (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, CD.REVIEWED_BY_DATE AS Date, CD.ANALYSIS_EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[COA_DETAILS] CD ON UD.USER_ID = CD.REVIEWED_BY_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE CD.ANALYSIS_EXP_ID = :analysisId) AS Reviewer ON Prepared.ANALYSIS_EXP_ID = Reviewer.ANALYSIS_EXP_ID LEFT JOIN (SELECT UD.FIRST_NAME + ' ' + UD.LAST_NAME AS Name, R.ROLE_NAME AS Designation, CD.APPROVED_BY_DATE AS Date, CD.ANALYSIS_EXP_ID FROM [dbo].[USERS_DETAILS] UD INNER JOIN [dbo].[COA_DETAILS] CD ON UD.USER_ID = CD.APPROVED_BY_USER_ID INNER JOIN [dbo].[USER_ROLE] R ON UD.ROLE_ID = R.ROLE_ID WHERE CD.ANALYSIS_EXP_ID = :analysisId) AS Approver ON Prepared.ANALYSIS_EXP_ID = Approver.ANALYSIS_EXP_ID INNER JOIN [dbo].[COA_DETAILS] CD ON Prepared.ANALYSIS_EXP_ID = CD.ANALYSIS_EXP_ID;
